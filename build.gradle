plugins {
    id 'java'
}

group = mod_group_id
version = mod_version

base {
    archivesName = 'StockExportBus-1.16.5'
}

sourceSets {
    apiStubs { java.srcDir 'src/apiStubs/java' }
    main { compileClasspath += apiStubs.output }
}

configurations {
    realForge
    realAe2
}

dependencies {
    // Real coordinates for a Forge 36.2.20 / AE2 8.4.4 workspace. The local
    // apiStubs source set lets this repository compile in restricted CI without
    // downloading Minecraft/Forge/AE2; those stubs are not packaged in the jar.
    realForge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    realAe2 "curse.maven:applied-energistics-2-223794:3528122"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

processResources {
    inputs.properties([mod_id: mod_id, mod_version: mod_version, mod_name: mod_name, forge_version: forge_version, minecraft_version: minecraft_version, ae2_version: ae2_version])
    filesMatching('META-INF/mods.toml') { expand project.properties }
}

jar {
    from sourceSets.main.output
    exclude '**/*.java'
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : 'SkyeSea'
        ])
    }
}
